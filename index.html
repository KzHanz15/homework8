<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园社团活动中心</title>
  <link rel="stylesheet" href="libs/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 统一入口与导航 -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">校园社团活动中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#activities">活动列表</a></li>
          <li class="nav-item"><a class="nav-link" href="#apply">我的报名</a></li>
          <li class="nav-item"><a class="nav-link" href="#stats">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html" target="_blank">三维导览</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 首页 -->
  <section id="home" class="container">
    <div class="alert alert-warning d-none" id="failTips" role="alert"></div>
    <div class="p-4 mb-3 rounded bg-white shadow-sm text-center">
      <h4>欢迎来到《校园社团活动中心》</h4>
      <p class="text-muted mb-0">选活动、报活动、看统计——本作品整合了页面、样式、交互、数据与可视化五个模块。</p>
    </div>
  </section>

  <!-- 活动列表（筛选交互） -->
  <section id="activities" class="container">
    <h2 class="section-title">活动列表</h2>
    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <label for="catSel" class="form-label">按类别筛选</label>
        <select class="form-select" id="catSel">
          <option value="all">全部类别</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="kwInput" class="form-label">关键词</label>
        <input type="text" class="form-control" id="kwInput" placeholder="输入活动名称/地点">
      </div>
    </div>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="actList"></div>
    <div class="text-muted" id="applyEmpty" style="display:none;">没有符合条件的活动。</div>
  </section>

  <!-- 我的报名（数据 + 本地保存，localStorage 持久化） -->
  <section id="apply" class="container">
    <h2 class="section-title">我的报名</h2>
    <form class="row g-2 mb-3 bg-white p-3 rounded shadow-sm" id="applyForm">
      <div class="col-md-4">
        <label for="actSel" class="form-label">选择活动</label>
        <select class="form-select" id="actSel"></select>
      </div>
      <div class="col-md-3">
        <label for="stuName" class="form-label">姓名</label>
        <input type="text" class="form-control" id="stuName" placeholder="请输入姓名">
      </div>
      <div class="col-md-3">
        <label for="stuNo" class="form-label">学号</label>
        <input type="text" class="form-control" id="stuNo" placeholder="请输入学号">
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button type="submit" class="btn btn-success w-100">报名</button>
      </div>
    </form>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="applyList"></div>
    <div class="text-muted" id="applyTip">还没有报名记录，选择活动报名试试。</div>
  </section>

  <!-- 统计（可视化） -->
  <section id="stats" class="container">
    <h2 class="section-title">活动统计</h2>
    <div class="card"><div class="card-body chart-box" id="statChart"></div></div>
    <p class="text-muted small mt-1">左侧：各类别活动数量；右侧：各类别累计报名人数。数据来源：activities.json。</p>
  </section>

  <footer class="text-center text-muted py-4">校园社团活动中心 · 个人自主实践原型</footer>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
