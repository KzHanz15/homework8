<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园信息中心 · 迷你版</title>
  <link rel="stylesheet" href="libs/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 统一入口与导航 -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">校园信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto" id="navList">
          <li class="nav-item"><a class="nav-link active" href="#home" data-target="home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#rooms" data-target="rooms">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="#stats" data-target="stats">使用统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html" target="_blank">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section id="home" class="container">
    <div class="alert alert-warning d-none" id="failTips" role="alert">网络异常或数据加载失败，请检查后再试。</div>

    <h2 class="section-title">校园快捷服务</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="homeCards"></div>

    <h2 class="section-title">服务说明</h2>
    <p class="text-muted">这里是迷你版校园公共信息与数据展示中心的首页。通过顶部导航可分别进入自修室查询、使用统计和校园三维导览。</p>

    <!-- 占位：各模块位置说明（第一步搭建骨架时先以文字占位） -->
    <div class="d-none" id="modulePlaceholder">
      <p>自习室查询模块：按楼层/开放状态筛选列表。</p>
      <p>使用统计模块：ECharts 柱状图（数据来源 data.json）。</p>
      <p>校园三维模块：A-Frame 校园导览，独立子页面。</p>
    </div>
  </section>

  <!-- 自习室查询（筛选交互） -->
  <section id="rooms" class="container">
    <h2 class="section-title">自习室查询</h2>
    <form class="row g-2 mb-3" id="filterForm">
      <div class="col-md-5">
        <label for="floorSel" class="form-label">楼层</label>
        <select class="form-select" id="floorSel">
          <option value="all">全部楼层</option>
          <option value="1">1层</option>
          <option value="2">2层</option>
          <option value="3">3层</option>
          <option value="4">4层</option>
        </select>
      </div>
      <div class="col-md-5">
        <label for="statusSel" class="form-label">开放状态</label>
        <select class="form-select" id="statusSel">
          <option value="all">全部状态</option>
          <option value="开放">开放</option>
          <option value="暂停">暂停</option>
          <option value="满员">满员</option>
        </select>
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button type="button" class="btn btn-primary w-100" id="resetBtn">重置</button>
      </div>
    </form>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="roomList"></div>
    <div class="text-muted" id="emptyTip">没有符合筛选条件的自习室。</div>
  </section>

  <!-- 使用统计（图表） -->
  <section id="stats" class="container">
    <h2 class="section-title">各自习室使用量统计</h2>
    <div class="card"><div class="card-body chart-box" id="usageChart"></div></div>
    <p class="text-muted small mt-1">数据来源：data.json（示例）</p>
  </section>

  <footer class="text-center text-muted py-4">校园信息中心 · 课堂作业八案例复现</footer>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
